<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shivam Sourav Jha — Portfolio</title>
  <meta name="description" content="Food &amp; lifestyle content creator — brand collaborations">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1793208611">
</head>
<body>
  <header class="hero">
    <nav>
      <span class="logo" id="site-name"></span>
      <div class="links">
        <a href="#work">Work</a>
        <a href="#brands">Brands</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
    <div class="hero-text">
      <h1 id="hero-name"></h1>
      <p id="tagline"></p>
    </div>
  </header>

  <main>
    <section id="work">
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="brands" class="brands">
      <h2>Brands I've worked with</h2>
      <p class="brand-count" id="brand-count"></p>
      <div class="brand-groups" id="brand-groups"></div>
    </section>

    <section id="about" class="about">
      <h2>About</h2>
      <p id="about-text"></p>
    </section>

    <section id="contact" class="contact">
      <h2>Let's work together</h2>
      <p class="contact-sub">Open to collaborations with food, beverage and lifestyle brands.</p>
      <a class="btn" id="email-link"></a>
      <a class="btn ghost" id="ig-link" target="_blank" rel="noopener"></a>
    </section>
  </main>

  <footer>© <span id="year"></span> <span id="footer-name"></span></footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous">&#8249;</button>
    <img id="lb-img" alt="">
    <button class="lb-next" aria-label="Next">&#8250;</button>
    <div class="lb-caption">
      <p id="lb-caption"></p>
      <a id="lb-link" class="btn" target="_blank" rel="noopener" hidden>Watch on Instagram ↗</a>
    </div>
  </div>

  <script src="config.js?v=1793208611"></script>
  <script src="script.js?v=1793208611"></script>
</body>
</html>
